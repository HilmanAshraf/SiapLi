<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SiapLI{% endblock %}</title>
  <!-- Bootstrap 5 via CDN (P4 may replace) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">SiapLI</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('upload') }}">Upload</a>
        <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-warning" role="alert">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="container text-muted py-4 border-top">
    <small>SiapLI — AI Internship Readiness &amp; Matching · Team NullForce</small>
  </footer>
</body>
</html>
