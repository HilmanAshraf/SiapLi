{% extends "base.html" %}
{% block title %}SiapLI — Cohort Dashboard{% endblock %}
{% block content %}
<h2 class="mb-4">Cohort skill-gap dashboard</h2>
<p class="text-muted">Most common missing skills across all analysed resumes.</p>

{% if labels %}
  <canvas id="gapChart" height="120"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script>
    const ctx = document.getElementById('gapChart');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: {{ labels | tojson }},
        datasets: [{
          label: 'Students missing this skill',
          data: {{ values | tojson }},
          backgroundColor: 'rgba(13, 110, 253, 0.6)'
        }]
      },
      options: {
        responsive: true,
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    });
  </script>
{% else %}
  <p class="text-muted">No data yet. Analyse some resumes first.</p>
{% endif %}
{% endblock %}
