{% extends "base.html" %}
{% block title %}SiapLI — Upload{% endblock %}
{% block content %}
<div class="col-lg-6 mx-auto">
  <h2 class="mb-3">Upload your resume</h2>
  <form method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">

    <div class="mb-3">
      <label for="resume" class="form-label">Resume file (PDF, DOCX, or TXT)</label>
      <input class="form-control" type="file" id="resume" name="resume"
             accept=".pdf,.docx,.txt" required>
    </div>

    <div class="mb-3">
      <label for="target_role" class="form-label">Target role (optional)</label>
      <input class="form-control" type="text" id="target_role" name="target_role"
             placeholder="e.g. Software Engineering Intern">
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="consent" name="consent" required>
      <label class="form-check-label" for="consent">
        I consent to my resume being analysed. Personal information
        (name, email, phone, IC) is removed before any AI processing.
      </label>
    </div>

    <button type="submit" class="btn btn-primary">Analyse my resume</button>
  </form>
</div>
{% endblock %}
